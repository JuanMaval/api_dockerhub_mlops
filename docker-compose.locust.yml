# Cubierta Forestal MLOps · Locust load generator (second machine)
#
# Runs ONLY Locust. The API stack (docker-compose.yml) lives on another VM;
# this file never starts it. Keeping the generator on a separate host means
# the CPU and memory spent simulating users do not compete with the API.
#
# Interactive (UI on :8089, ramp users by hand):
#   LOCUST_HOST=http://<VM_IP>:80 docker compose -f docker-compose.locust.yml up -d
#
# Headless, same parameters for every level and for 1 and 3 replicas. The
# master still coordinates the workers (--expect-workers), so the traffic is
# generated by LOCUST_WORKERS processes, not by a single one. -u users,
# -r spawn rate, -t duration; --csv writes the stats to ./results on this host.
#   mkdir -p results     # create it first: Docker would create it as root
#   LOCUST_HOST=http://<VM_IP>:80 \
#   LOCUST_ARGS="--headless -u 50 -r 5 -t 3m --csv /mnt/results/replicas1_u50" \
#   docker compose -f docker-compose.locust.yml up --abort-on-container-exit
#
# Watch the generator too (`docker stats` on this machine): if it saturates
# before the API VM, the numbers describe the generator, not the service.
# Tunables (env or .env): LOCUST_HOST (required), LOCUST_WORKERS, LOCUST_PORT,
# LOCUST_ARGS.

name: cubierta-forestal-loadtest

x-locust: &locust
  image: locustio/locust:2.46.7
  volumes:
    - ./services/locust:/mnt/locust:ro

services:
  locust-master:
    <<: *locust
    container_name: cf-locust-master
    command: >-
      -f /mnt/locust/locustfile.py --master
      --host ${LOCUST_HOST:?Set LOCUST_HOST=http://<VM_IP>:<NGINX_PORT>}
      --expect-workers ${LOCUST_WORKERS:-2}
      ${LOCUST_ARGS:-}
    ports:
      - "${LOCUST_PORT:-8089}:8089"
    volumes:
      - ./services/locust:/mnt/locust:ro
      - ./results:/mnt/results

  # Workers generate the traffic; the master only coordinates and aggregates.
  # One worker per generator CPU core is a reasonable default.
  locust-worker:
    <<: *locust
    command: -f /mnt/locust/locustfile.py --worker --master-host locust-master
    deploy:
      replicas: ${LOCUST_WORKERS:-2}
    depends_on:
      - locust-master
