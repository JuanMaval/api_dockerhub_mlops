# Nginx · load balancer in front of the Inference API replicas.
#
# `docker compose` gives every replica of `inference-api` its own IP behind the
# same DNS name. `resolve` makes Nginx re-query Docker's embedded DNS
# (127.0.0.11), so replicas added with `--scale` or restarted with a new IP
# join the pool without reloading Nginx.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # Short DNS cache: restarted/scaled replicas get new IPs and must be
    # picked up quickly (stale IPs caused 502s for ~10s after a restart).
    resolver 127.0.0.11 valid=2s ipv6=off;

    # $upstream_addr shows which replica answered; $upstream_response_time is
    # the time spent in the API, $request_time includes Nginx.
    log_format upstream '$remote_addr "$request" $status '
                        'upstream=$upstream_addr '
                        'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log upstream;

    upstream inference_api {
        zone inference_api 64k;
        # Inference is CPU-bound: send each request to the replica with the
        # fewest in-flight requests instead of plain round-robin.
        least_conn;
        # max_fails=0: never take a replica out of the pool for fail_timeout
        # after one failed attempt; proxy_next_upstream retries another one.
        server inference-api:8000 resolve max_fails=0;
        keepalive 64;
    }

    server {
        listen 80;

        # Liveness of Nginx itself (does not touch the API)
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://inference_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Retry on another replica if one is down or restarting
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            # Same Docker network: a connect that takes longer is a dead IP
            proxy_connect_timeout 500ms;
            proxy_read_timeout 30s;

            add_header X-Upstream $upstream_addr always;
        }
    }
}
